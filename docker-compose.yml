services:
  postgres:
    image: postgres:16-alpine
    container_name: altix-postgres
    restart: always
    environment:
      POSTGRES_USER: altix_user
      POSTGRES_PASSWORD: altix_secure_password
      POSTGRES_DB: altix_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altix_user -d altix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: altix-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: altix-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://altix_user:altix_secure_password@postgres:5432/altix_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: altix_super_secret_jwt_key_2026
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-go:
    build:
      context: ./apps/backend-go
      dockerfile: Dockerfile
    container_name: altix-backend-go
    restart: always
    environment:
      REDIS_URL: redis:6379
      DATABASE_URL: postgresql://altix_user:altix_secure_password@postgres:5432/altix_db
      CONCURRENT_WORKERS: 500
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: altix-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
